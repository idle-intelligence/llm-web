[workspace]
members = [
    "crates/lean",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/idle-intelligence/llm-web"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
byteorder = "1.5"

# Templating (Jinja2-compatible chat templates)
minijinja = { version = "2", features = ["json", "preserve_order"] }

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", default-features = false }
wgpu = { version = "26", features = ["fragile-send-sync-non-atomic-wasm"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Tokenizer (0.22, no default features — onig/esaxx_fast are not wasm32-safe;
# fancy-regex is used instead)
tokenizers = { version = "0.22", default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.release-wasm]
inherits = "release"
opt-level = "s"
