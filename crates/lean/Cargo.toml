[package]
name = "lean"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The text-in/text-out engine on lean-core's forward pass.
[features]
default = ["native-bin"]
wasm = ["lean-core/wasm"]
# Native CLI binaries (lean-cli, lean-bench-usecases): pulls in pollster/clap,
# which are not wasm32-safe. Gated behind a feature (rather than a bare
# target cfg) and required-features on the [[bin]] entries below, so
# `cargo build --target wasm32-unknown-unknown --no-default-features
# --features web` skips the bins outright instead of failing to compile
# them for wasm32. Included in `default` so a plain native `cargo build`/
# `cargo clippy --all-targets` still builds both binaries.
# lean-cli renders fixture prompts with lean-chat; the library itself never
# uses it.
native-bin = ["dep:pollster", "dep:clap", "dep:lean-chat"]
# wasm-bindgen surface (src/web.rs). The web package also carries lean-chat's
# bindings (ChatTemplate, chatRender, chatTrimOldestExchange), so a page
# loads one wasm for both; the engine code never calls lean-chat.
# onig/esaxx_fast are not wasm32-safe; unstable_wasm swaps out rayon for
# wasm32.
web = [
    "wasm",
    "lean-core/web",
    "dep:lean-chat",
    "lean-chat/web",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "getrandom/wasm_js",
]
# See lean-core's feature of the same name.
force_scalar = ["lean-core/force_scalar"]
# The CPU forward pass on a thread pool (lean-core's `threads`).
threads = ["lean-core/threads", "dep:rayon"]
# Threaded wasm build: `threads` plus the wasm-bindgen-rayon worker-pool
# shim (re-exported as `init_thread_pool` from `lib.rs`). Needs a separate
# nightly + atomics wasm build (scripts/build.sh with BUILD_THREADS=1) and a
# cross-origin-isolated page (COOP/COEP) to actually spin up workers.
wasm-mt = ["web", "threads", "dep:wasm-bindgen-rayon"]

[dependencies]
lean-core = { path = "../lean-core" }
anyhow = { workspace = true }
wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lean-chat = { path = "../lean-chat", optional = true }

wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
lean-chat = { path = "../lean-chat" }
pollster = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "0.3", optional = true }
clap = { workspace = true, optional = true }
# native-only: tokenizers/fancy-regex only, onig/esaxx_fast are not
# wasm32-safe - see the wasm32 target block below for the browser build.
tokenizers = { workspace = true, features = ["fancy-regex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { workspace = true, features = ["unstable_wasm", "fancy-regex"] }
wasm-bindgen-rayon = { version = "1.3", optional = true }

[[bin]]
name = "lean-cli"
path = "src/bin/lean_cli.rs"
required-features = ["native-bin"]

[[bin]]
name = "lean-bench-usecases"
path = "src/bin/lean_bench_usecases.rs"
required-features = ["native-bin"]
