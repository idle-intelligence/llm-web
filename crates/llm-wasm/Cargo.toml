[package]
name = "llm-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qwen2-family LLM (xLAM-2-3b-fc-r) in Burn+wgpu — runs natively and in browser via WASM+WebGPU"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "llm-agent"
path = "src/bin/llm-agent.rs"
required-features = ["native"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["wgpu", "native"]
wgpu = ["burn/wgpu", "burn/template"]
# Native CLI + native tokenizer build (never compiled for wasm32 — the `llm-agent`
# bin is gated on this feature via `required-features` above).
native = ["dep:clap", "dep:tokenizers", "tokenizers/fancy-regex"]
web = [
    "wgpu",
    "dep:wgpu",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "getrandom/wasm_js",
    "dep:tokenizers",
    "tokenizers/unstable_wasm",
    "tokenizers/fancy-regex",
]

[dependencies]
# Burn ML framework
burn = { workspace = true }
cubecl = { workspace = true }

# Core
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
byteorder = { workspace = true }

# Chat templating (Jinja2-compatible; xLAM-2's embedded chat_template uses `tojson`)
minijinja = { workspace = true }

# Tokenizer — onig/esaxx_fast (C/C++) are not wasm32-safe, so default features
# are off everywhere; fancy-regex is the wasm-safe regex backend, and
# unstable_wasm additionally swaps out rayon for wasm32 (see `web` feature).
tokenizers = { workspace = true, optional = true }

# CLI (native only)
clap = { workspace = true, optional = true }

# WASM support (optional)
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
pollster = "0.4"
