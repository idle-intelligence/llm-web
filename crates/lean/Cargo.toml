[package]
name = "lean"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Raw wgpu + hand-written WGSL only. No Burn, no CubeCL, no training - see
# ~/.claude/projects/-Users-tc-Code/memory/project_lean_engine_direction.md.
[features]
default = ["native-bin"]
wasm = ["wgpu/webgpu"]
# Native CLI binaries (lean-cli, lean-bench-usecases): pulls in pollster/clap,
# which are not wasm32-safe. Gated behind a feature (rather than a bare
# target cfg) and required-features on the [[bin]] entries below, so
# `cargo build --target wasm32-unknown-unknown --no-default-features
# --features web` skips the bins outright instead of failing to compile
# them for wasm32. Included in `default` so a plain native `cargo build`/
# `cargo clippy --all-targets` still builds both binaries.
native-bin = ["dep:pollster", "dep:clap"]
# Minimal wasm-bindgen surface (src/web.rs): load GGUF + tokenizer bytes from
# JS, generate greedily. Same tokenizers feature pattern as
# crates/llm-wasm/Cargo.toml's `web` feature (onig/esaxx_fast are not
# wasm32-safe; unstable_wasm swaps out rayon for wasm32).
web = [
    "wasm",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "getrandom/wasm_js",
]
# Dev-only: forces cpu_kernels' aarch64 dot kernels to the scalar fallback
# even when compiled for aarch64, so the NEON-vs-scalar delta can be
# measured with the same lean-cli binary otherwise unchanged - see
# docs/runs/2026-09-28-lean-cpu.md.
force_scalar = []

[dependencies]
anyhow = { workspace = true }
byteorder = { workspace = true }
bytemuck = { version = "1.25", features = ["derive"] }
half = "2.4"
wgpu = { workspace = true }
futures-channel = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
minijinja = { workspace = true }

wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "0.3", optional = true }
clap = { workspace = true, optional = true }
# native-only: tokenizers/fancy-regex only, onig/esaxx_fast are not
# wasm32-safe - see the wasm32 target block below for the browser build.
tokenizers = { workspace = true, features = ["fancy-regex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { workspace = true, features = ["unstable_wasm", "fancy-regex"] }

[[bin]]
name = "lean-cli"
path = "src/bin/lean_cli.rs"
required-features = ["native-bin"]

[[bin]]
name = "lean-bench-usecases"
path = "src/bin/lean_bench_usecases.rs"
required-features = ["native-bin"]
