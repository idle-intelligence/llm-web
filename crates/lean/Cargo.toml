[package]
name = "lean"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Raw wgpu + hand-written WGSL only. No Burn, no CubeCL, no training - see
# ~/.claude/projects/-Users-tc-Code/memory/project_lean_engine_direction.md.
[features]
default = []
wasm = ["wgpu/webgpu"]
# Minimal wasm-bindgen surface (src/web.rs): load GGUF + tokenizer bytes from
# JS, generate greedily. Same tokenizers feature pattern as
# crates/llm-wasm/Cargo.toml's `web` feature (onig/esaxx_fast are not
# wasm32-safe; unstable_wasm swaps out rayon for wasm32).
web = [
    "wasm",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "getrandom/wasm_js",
]
# Dev-only: forces cpu_kernels' aarch64 dot kernels to the scalar fallback
# even when compiled for aarch64, so the NEON-vs-scalar delta can be
# measured with the same lean-cli binary otherwise unchanged - see
# docs/runs/2026-09-28-lean-cpu.md.
force_scalar = []
# CPU threads rung (cpu.rs's `linear()`): parallelises the rows*out_dim
# independent dot products in each matvec/GEMM across a thread pool sized
# by capability (`rayon::current_num_threads()`, which is
# `std::thread::available_parallelism()` on native and whatever
# `initThreadPool(n)` set on wasm - see `cpu.rs`'s doc comment). Native-only
# by itself; combine with `wasm-mt` for the browser build.
threads = ["dep:rayon"]
# Threaded wasm build: `threads` plus the wasm-bindgen-rayon worker-pool
# shim (re-exported as `init_thread_pool` from `lib.rs`). Needs a separate
# nightly + atomics wasm build - see scripts/build-lean-mt.sh - and a
# cross-origin-isolated page (COOP/COEP) to actually spin up workers.
wasm-mt = ["web", "threads", "dep:wasm-bindgen-rayon"]

[dependencies]
anyhow = { workspace = true }
byteorder = { workspace = true }
bytemuck = { version = "1.25", features = ["derive"] }
half = "2.4"
wgpu = { workspace = true }
futures-channel = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
minijinja = { workspace = true }

wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
rayon = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.3"
clap = { workspace = true }
# native-only: tokenizers/fancy-regex only, onig/esaxx_fast are not
# wasm32-safe - see the wasm32 target block below for the browser build.
tokenizers = { workspace = true, features = ["fancy-regex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { workspace = true, features = ["unstable_wasm", "fancy-regex"] }
wasm-bindgen-rayon = { version = "1.3", optional = true }

[[bin]]
name = "lean-cli"
path = "src/bin/lean_cli.rs"

[[bin]]
name = "lean-bench-usecases"
path = "src/bin/lean_bench_usecases.rs"
